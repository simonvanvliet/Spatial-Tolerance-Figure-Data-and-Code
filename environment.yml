name: spatial_tolerance_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python>=3.10

  # Core scientific stack
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.14
  - scikit-learn>=1.7
  - statsmodels>=0.14
  - sympy=1.14

  # Plotting
  - matplotlib>=3.9
  - seaborn>=0.13

  # Image I/O and processing
  - scikit-image>=0.24
  - tifffile>=2024.1
  - pillow>=10.0
  - h5py>=3.11

  # Out-of-memory computation
  - dask>=2024.1
  - dask-image>=0.6
  - zarr>=2.18

  # Interactive image viewer
  - napari>=0.5

  # Spreadsheet I/O
  - openpyxl>=3.1

  # Jupyter
  - jupyterlab>=4.0
  - ipykernel>=6.0

  # Pip-only packages
  - pip
  - pip:
    - nd2>=0.10           # ND2 file reader
    - napari-animation>=0.0.5
    - scikit-posthocs>=0.9
