name: spatial_tolerance_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python==3.9

  # Core scientific stack
  - numpy==1.24
  - pandas==2.3
  - scipy==1.13
  - scikit-learn==1.0
  - statsmodels==0.14
  - sympy==1.14

  # Plotting
  - matplotlib==3.5
  - seaborn==0.13

  # Image I/O and processing
  - scikit-image==0.19
  - tifffile==2023.4
  - pillow==10.4
  - h5py==3.6

  # Out-of-memory computation
  - dask==2024.2
  - dask-image==2021.12
  - zarr==2.13

  # Interactive image viewer
  - napari==0.4

  # Spreadsheet I/O
  - openpyxl==3.1

  # Jupyter
  - jupyterlab>=4.0
  - ipykernel==6.9

  # Pip-only packages
  - pip
  - pip:
    - nd2==0.10           # ND2 file reader
    - napari-animation==0.0
    - scikit-posthocs==0.11
